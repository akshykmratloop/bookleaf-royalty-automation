# Local dev stack for the BookLeaf royalty-summary workflows (n8n + Postgres).
# Start with:  node docker/bootstrap.mjs   (writes .secrets/, runs compose, creates the owner + API key)
# The n8n image tag is pinned in docker/N8N_VERSION and passed in as N8N_VERSION.
name: bookleaf-n8n-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
    env_file:
      - ../.secrets/n8n-local.compose.env   # POSTGRES_PASSWORD (generated)
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      - ../infra/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    image: n8nio/n8n:${N8N_VERSION:?set N8N_VERSION from docker/N8N_VERSION}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - ../.secrets/n8n-local.compose.env   # N8N_ENCRYPTION_KEY, DB_POSTGRESDB_PASSWORD, DEFAULT_DEMO_INBOX, EMAIL_FROM
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      # Code nodes read workflow settings from $env (same as production).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Workflow settings (production uses the same names).
      ALLOW_DRILLS: "true"
      EMAIL_PROVIDER: smtp
      CALLBACK_MODE: pull
      DATA_SOURCE: payload
      MAX_SENDS_PER_HOUR: "60"
      REFERENCE_DATE_DEFAULT: "2025-12-31"
      AI_PRIMARY_MODEL: claude-sonnet-5-5
      AI_FALLBACK_MODEL: gpt-4.1-mini
      AI_EFFORT: medium
      BUBBLE_APP_BASE: ""
      BRAND_SUPPORT_EMAIL: ""
      N8N_INTERNAL_URL: http://127.0.0.1:5678
    volumes:
      - ./.data/n8n:/home/node/.n8n
