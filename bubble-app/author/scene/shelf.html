<section id="bl-shelf" class="bl-shelf is-loading" aria-labelledby="bl-shelf-title">
  <div class="bl-shelf-stage">
    <div class="bl-shelf-light" aria-hidden="true"></div>
    <canvas class="bl-shelf-dust" aria-hidden="true"></canvas>
    <div class="bl-shelf-row" role="list" aria-label="Your books"></div>
    <div class="bl-shelf-plank" aria-hidden="true"></div>
  </div>
  <div class="bl-shelf-note">
    <p class="bl-shelf-eyebrow">Your shelf</p>
    <h2 class="bl-shelf-title" id="bl-shelf-title">Gathering your books…</h2>
    <ul class="bl-shelf-legend" aria-label="Royalty status of each book"></ul>
    <p class="bl-shelf-hint">Select a book to jump to its details.</p>
  </div>
  <div class="bl-shelf-tip" id="bl-shelf-tip" role="tooltip" aria-hidden="true"></div>
</section>
